# How `include/tilefish.h` is generated from this crate (`tests/header.rs` generates it again and requires the committed file to be the same; run
# it with TILEFISH_BLESS=1 to write it).
language = "C"
# the include guard is in `header` and `trailer`, so that the inline function of the trailer is inside it
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "both"
usize_is_size_t = true
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
line_length = 140
tab_width = 4
header = """
/*
 * tilefish.h: the C ABI of the tilefish host (libtilefish_capi). Generated by cbindgen from crates/tilefish-capi: do not edit, generate it again.
 *
 * Licensed under either of Apache License, Version 2.0 or MIT license at your option.
 *
 * The conventions (docs/rfcs/0002-cpp-host.md, section 5):
 *
 *  - Every function that can fail returns a tilefish_status (TILEFISH_OK is 0) and writes its result through an out-parameter, which is NULL
 *    after a failure; tilefish_last_error has the details of the last failure of the thread.
 *  - A handle is made by a *_load, *_create or *_instantiate function and freed by its *_destroy function (NULL is a no-op there). Handles are
 *    independent: a kernel keeps its context and module alive, a run its plan and arena, so they can be destroyed in any order.
 *  - Strings are NUL-terminated UTF-8. A string the library returns is owned by the handle it came from (or is static) and lives as long as it.
 *  - Arrays are a pointer and a count; the pointer may be NULL when the count is 0. Nothing the caller passes is kept after a call returns,
 *    except the memory regions of a captured plan's externals and taps and of a weighted run's weights (see tilefish_tensor).
 *  - Every call leaves the thread's current CUDA context as it found it. A stream is a CUstream (the same type as cudaStream_t) of the handle's
 *    context, or NULL for the legacy default stream.
 *  - Every handle may be used from several threads at once, except a tilefish_captured_plan (one thread at a time, any thread). A handle is
 *    never destroyed while another thread uses it.
 *  - A minor version of the ABI only adds functions and values: treat an unknown status as an error.
 *
 * In C99, include <cuda.h> (if at all) before this header: both declare CUcontext and CUstream.
 */

#ifndef TILEFISH_H
#define TILEFISH_H
"""
after_includes = """

#if !defined(__cuda_cuda_h__)
/** A CUDA context of the driver API, as <cuda.h> declares it. */
typedef struct CUctx_st *CUcontext;
/** A CUDA stream of the driver API (the same type as the runtime API's cudaStream_t), as <cuda.h> declares it. */
typedef struct CUstream_st *CUstream;
#endif
"""
trailer = """

/**
 * Whether the library loaded implements the ABI this header describes: the same major version, and a minor version at least the header's.
 */
static inline bool tilefish_abi_compatible(void) {
    uint32_t version = tilefish_abi_version();
    return (version >> 16) == TILEFISH_ABI_MAJOR && (version & 0xffffu) >= TILEFISH_ABI_MINOR;
}

#endif /* TILEFISH_H */
"""

[parse]
parse_deps = false

[export]
# the order of the declarations is the order of the source (cbindgen sorts nothing)
item_types = ["constants", "typedefs", "opaque", "structs", "functions"]

[export.rename]

[fn]
args = "auto"

[const]
allow_static_const = false
