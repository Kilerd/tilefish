[package]
name = "tilefish"
version = "0.0.3"
edition = "2024"
description = "Typed tensor DSL for GPU kernels: shapes, dtypes and quantization formats in the type, one compiled artifact for Python, C++ and Rust hosts. This crate is the Rust host of a tilefish manifest: it verifies a manifest directory and launches its cubins, its pinned cuBLASLt GEMMs and its launch plans, alone, as plan sets or on a shared arena."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kilerd/tilefish"
readme = "README.md"
# The test fixtures (cubins, manifests, vectors) are for this repository's tests, not for users of the crate.
exclude = ["tests/"]
keywords = ["gpu", "cuda", "dsl", "tensor", "quantization"]
categories = ["compilers", "science"]

[dependencies]
# cudarc's safe layer over the CUDA driver API (contexts, modules, functions, streams, the launch builder), loaded at run
# time (`dynamic-loading`): the crate builds and its tests run on a machine without CUDA. `nvrtc` is there for
# `CudaContext::load_module` (a cubin is loaded with `Ptx::from_binary`); with `dynamic-loading` the NVRTC library is opened
# only when a function of it is called, which this crate never does. The `cuda-*` feature of cudarc picks the bindings. `cublaslt` is
# cudarc's cuBLASLt bindings (`cublaslt::result` and `cublaslt::sys`, which this crate calls to run a pinned algorithm: the safe
# `CudaBlasLT::matmul` always runs the heuristic and cannot take one); with `dynamic-loading` libcublasLt is opened only when the first
# call of a GEMM is made, and a manifest without `library` entries never opens it. 0.19.10 is the oldest cudarc this crate builds
# with: it calls `CudaFunction::cu_function` and `CUgraphInstantiate_flags(0)`, which 0.19.10 added (README: "In a workspace that uses
# cudarc itself").
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "dynamic-loading", "nvrtc", "cublaslt"] }
ryu = "1.0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"

[features]
# Pick exactly one: the CUDA driver API version the bindings are generated for. The driver found at run time must be
# at least as new as the bindings' version. 13.2 is the driver of the B300 the crate is tested on. A workspace that enables a
# `cuda-*` feature of cudarc itself depends on this crate with `default-features = false` and the same feature: cudarc does
# not compile with two.
default = ["cuda-13020"]
cuda-12040 = ["cudarc/cuda-12040"]
cuda-12080 = ["cudarc/cuda-12080"]
cuda-13000 = ["cudarc/cuda-13000"]
cuda-13020 = ["cudarc/cuda-13020"]
# Builds `tests/gpu_gate.rs`, the Rust half of the byte-identity gate against Python's `replay` (it needs a GPU and the
# files that `python/tests/rust_gate.py` writes).
gpu-gate = []

[[test]]
name = "gpu_gate"
required-features = ["gpu-gate"]

[[test]]
name = "gpu_plan_gate"
required-features = ["gpu-gate"]
