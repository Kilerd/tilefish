[project]
name = "tilefish"
version = "0.0.11"
description = "Typed tensor DSL for GPU kernels: shapes, dtypes and quantization formats in the type, one compiled artifact for Python, C++ and Rust hosts. Early preview: types, tracing and Triton AOT compile specs."
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
authors = [{ name = "Kilerd Chan" }]
readme = "README.md"
classifiers = ["Development Status :: 2 - Pre-Alpha"]

[project.scripts]
tilefish-explain = "tilefish.explain:main"

[project.urls]
Repository = "https://github.com/Kilerd/tilefish"

[project.optional-dependencies]
# Building cubins and running kernels (tilefish.aot.build, tilefish.run). The core package needs none of these,
# and `import tilefish` never imports them.
gpu = ["torch>=2.9", "triton>=3.5", "cuda-python>=12.8"]
# CUDA 13's nvdisasm, which reads the SASS of every architecture tilefish builds for (Triton 3.5.1's bundled CUDA 12.8 one cannot decode sm_103): the
# SASS assertions and tilefish-explain prefer it (docs/explain.md)
sass = ["nvidia-cuda-nvdisasm>=13; sys_platform == 'linux' or sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device with torch, triton and cuda-python; skipped automatically when any is missing",
    "cuda_math: the exhaustive comparisons with CUDA's math library, to run again on a CUDA or torch change (docs/numerics.md)",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
